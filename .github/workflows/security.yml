name: V2 Security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the offline scanner regressions
        shell: pwsh
        run: ./scripts/security/Test-OfflineSecretScan.ps1
      - name: Scan the exact baseline candidate set
        shell: pwsh
        run: ./scripts/security/Invoke-OfflineSecretScan.ps1 -Source .
      - name: Install checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.29.1'
          GITLEAKS_LINUX_X64_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors \
            --output "${archive_path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive_path}" | sha256sum --check --status
          tar --extract --gzip --file="${archive_path}" --directory="${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Create the exact tracked-file mirror
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/gitleaks-candidate"
          mkdir --parents "${candidate_dir}"
          git ls-files -z \
            | tar --null --files-from=- --create --file=- \
            | tar --extract --file=- --directory="${candidate_dir}"
          printf 'GITLEAKS_CANDIDATE_DIR=%s\n' "${candidate_dir}" >> "${GITHUB_ENV}"
      - name: Scan the exact tracked-file mirror with redaction
        shell: bash
        run: >-
          gitleaks dir
          --config .gitleaks.toml
          --redact=100
          --exit-code=1
          --no-banner
          "${GITLEAKS_CANDIDATE_DIR}"
      - name: Scan the complete Git history with redaction
        shell: bash
        run: >-
          gitleaks git
          --config .gitleaks.toml
          --redact=100
          --exit-code=1
          --no-banner
          --log-opts="--all"
          .

  dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Enable Maven Wrapper
        run: chmod +x mvnw
      - name: Validate dependency vulnerability policy implementation
        shell: pwsh
        run: ./scripts/validation/Test-DependencyVulnerabilityPolicy.ps1 -VerifyImplementation
      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Configure o secret NVD_API_KEY antes de executar a auditoria de dependências."
            exit 1
          fi
      - name: Generate dependency vulnerability report
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw --batch-mode --no-transfer-progress -Psecurity-audit clean verify
      - name: Validate dependency vulnerability machine report
        if: always()
        shell: pwsh
        run: ./scripts/validation/Test-DependencyVulnerabilityPolicy.ps1 -ReportPath target/dependency-check/dependency-check-report.json
      - name: Preserve dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: target/dependency-check/
          if-no-files-found: error
          retention-days: 14
