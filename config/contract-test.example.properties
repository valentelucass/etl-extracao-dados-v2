# Configuracao exclusiva para a suite Maven contract-tests. Nao use valores reais no Git.
# A suite aceita somente CONTRACT_* e nunca reutiliza automaticamente API_*.
# A execucao remota tambem exige: -Pcontract-tests -Dcontract.tests.enabled=true
# Janelas de negócio usam YYYY-MM-DD..YYYY-MM-DD. A janela updated_at usa dois Instants ISO-8601 com offset,
# separados por ..; nunca inclua URL, token, payload de negocio, ID ou hash de ID.
# Sem qualquer CONTRACT_*, a IT remota e ignorada sem abrir conexao. Se houver alguma, todas as obrigatorias
# abaixo precisam estar presentes e validas antes da primeira conexao.

CONTRACT_DATAEXPORT_BASE_URL=https://<host-data-export-autorizado>
CONTRACT_DATAEXPORT_TOKEN=<fornecer-fora-do-git>
CONTRACT_GRAPHQL_URL=https://<host-graphql-autorizado>
CONTRACT_GRAPHQL_TOKEN=<fornecer-fora-do-git>
CONTRACT_SOURCE_TIMEZONE=<fuso-iana-confirmado-pelo-fornecedor>
# Opcional; false por padrao. Nao substitui a declaracao formal do fornecedor.
CONTRACT_SOURCE_TIMEZONE_FORMALLY_CONFIRMED=false
# Opcional; 30 segundos por padrao.
CONTRACT_REQUEST_TIMEOUT_SECONDS=<segundos-positivos-opcional>
# Teto agregado de tentativas remotas por entidade, compartilhado entre Data Export e GraphQL.
CONTRACT_6908_MAX_CALLS=<teto-total-aprovado-para-6908>
CONTRACT_6389_MAX_CALLS=<teto-total-aprovado-para-6389>
# Na autonomia atual de consulta remota, somente GET_WITH_QUERY e permitido para 6908/6389.
CONTRACT_DATAEXPORT_TRANSPORT=GET_WITH_QUERY
CONTRACT_MAX_RESPONSE_BYTES=<teto-de-bytes-por-resposta-opcional>
# Os dois valores devem ser positivos, distintos e previamente aprovados para a fonte.
CONTRACT_PAGE_SIZE_A=<primeiro-per-aprovado>
CONTRACT_PAGE_SIZE_B=<segundo-per-aprovado>
CONTRACT_6908_POPULATED_WINDOW=<janela-populada-aprovada>
CONTRACT_6908_EMPTY_WINDOW=<janela-vazia-declarada>
CONTRACT_6908_LATE_CHANGE_BUSINESS_WINDOW=<yyyy-mm-dd..yyyy-mm-dd>
CONTRACT_6908_LATE_CHANGE_UPDATED_AT_WINDOW=<instant-iso..instant-iso>
# Opcionais; false por padrao. So use true com confirmacao formal rastreavel fora deste arquivo.
CONTRACT_6908_ORDER_TOTAL_OR_CURSOR_CONFIRMED=false
CONTRACT_6908_COVERAGE_CONFIRMED=false
CONTRACT_6389_POPULATED_WINDOW=<janela-populada-aprovada>
CONTRACT_6389_EMPTY_WINDOW=<janela-vazia-declarada>
CONTRACT_6389_LATE_CHANGE_BUSINESS_WINDOW=<yyyy-mm-dd..yyyy-mm-dd>
CONTRACT_6389_LATE_CHANGE_UPDATED_AT_WINDOW=<instant-iso..instant-iso>
CONTRACT_6389_ORDER_TOTAL_OR_CURSOR_CONFIRMED=false
CONTRACT_6389_COVERAGE_CONFIRMED=false
# Opcional e somente para a sonda auxiliar de evidência financeira. Não cria módulo 4924,
# persistência ou carga recorrente. Se CONTRACT_4924_ENABLED=true, todas as chaves abaixo
# são obrigatórias e a sonda usa uma amostra fechada de per=1, sem fallback ou retry.
CONTRACT_4924_ENABLED=false
CONTRACT_4924_TEMPLATE_ID=4924
CONTRACT_4924_ROOT=<raiz-tecnica-aprovada>
CONTRACT_4924_BUSINESS_FILTER=<filtro-de-data-de-negocio-aprovado>
CONTRACT_4924_CLOSED_WINDOW=<yyyy-mm-dd..yyyy-mm-dd>
CONTRACT_4924_ORDER_BY=<ordenacao-tecnica-aprovada>
CONTRACT_4924_TRANSPORT=<GET_WITH_BODY-ou-GET_WITH_QUERY-ou-POST_JSON-aprovado>
CONTRACT_4924_MAX_CALLS=<teto-proprio-aprovado>
