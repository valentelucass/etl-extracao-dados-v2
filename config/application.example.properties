# Catálogo não secreto para o runtime V2. Informe este arquivo explicitamente por --config.
# A precedência é: variável V2_* não vazia, depois este arquivo. Propriedades -D não configuram
# o runtime e qualquer nome classificado como segredo é recusado.

# O V2 só permite execução em sombra; não existe ambiente produtivo como default.
runtime.environment=LOCAL_SHADOW
runtime.business-timezone=America/Sao_Paulo

# A fonte fica desligada até o comando de execução ser entregue e receber autorização própria.
# Quando habilitada, todos os valores abaixo são obrigatórios e o token vem somente de
# V2_DATAEXPORT_TOKEN no provider protegido, nunca deste arquivo, -D ou argumentos CLI.
dataexport.enabled=false
# dataexport.base-url=https://<host-autorizado>
# dataexport.source-instance=<identificador-estavel-nao-secreto>
# dataexport.tenant-scope=<escopo-nao-secreto>
# dataexport.timezone=America/Sao_Paulo
# dataexport.transport=GET_WITH_QUERY
# dataexport.timeout-seconds=30
# dataexport.max-response-bytes=10485760
# dataexport.retry.max-attempts=3
# dataexport.retry.initial-delay-ms=500
# dataexport.retry.max-delay-ms=10000
# O governor é conservador por origem ESL: exatamente uma requisição em voo e budgets explícitos.
# dataexport.resilience.minimum-request-interval-ms=250
# dataexport.resilience.max-in-flight=1
# dataexport.resilience.max-requests-per-cycle=10000
# dataexport.resilience.max-requests-per-workload=5000
# dataexport.resilience.step-timeout-seconds=900
# dataexport.resilience.cycle-timeout-seconds=3600
# dataexport.resilience.max-retry-after-ms=10000
# dataexport.resilience.max-repartitions=8
# dataexport.resilience.circuit-failure-threshold=3
# dataexport.resilience.circuit-cooldown-seconds=60

# Adaptador GraphQL transitório desligado por padrão. Enquanto V2-041 estiver em EXTERNAL_HOLD,
# não materialize V2_GRAPHQL_TOKEN nem aponte este catálogo para origem remota. Quando houver
# autorização operacional, GraphQL e Data Export devem compartilhar instância, tenant e policy ESL.
graphql.enabled=false
# graphql.endpoint=https://<host-autorizado>/graphql
# graphql.source-instance=<mesmo-identificador-esl-do-dataexport>
# graphql.tenant-scope=<mesmo-escopo-do-dataexport>
# graphql.timeout-seconds=30
# graphql.max-response-bytes=10485760
# graphql.retry.max-attempts=3
# graphql.retry.initial-delay-ms=500
# graphql.retry.max-delay-ms=10000
# graphql.resilience.minimum-request-interval-ms=250
# graphql.resilience.max-in-flight=1
# graphql.resilience.max-requests-per-cycle=10000
# graphql.resilience.max-requests-per-workload=5000
# graphql.resilience.step-timeout-seconds=900
# graphql.resilience.cycle-timeout-seconds=3600
# graphql.resilience.max-retry-after-ms=10000
# graphql.resilience.max-repartitions=8
# graphql.resilience.circuit-failure-threshold=3
# graphql.resilience.circuit-cooldown-seconds=60

# Auditoria local continua desligada por padrão. A única allowlist atual é o banco local isolado;
# preflight recusa ETL_SISTEMA, esl_cloud e qualquer alvo não local. Não há usuário/senha aqui.
shadow.audit.enabled=false
# shadow.target-kind=LOCAL_EPHEMERAL
# shadow.jdbc-url=jdbc:sqlserver://127.0.0.1:<porta-local>;databaseName=ETL_SISTEMA_V2_SHADOW;integratedSecurity=true;encrypt=true;trustServerCertificate=true
